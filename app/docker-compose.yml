services:
  mongo:
    image: mongo:7
    container_name: pos-tienditas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  minio:
    # Docker Hub minio/minio may be blocked on some hosts; Quay mirror works for local/dev
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: pos-tienditas-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  minio_data:
