# Fly.io app config for POS Tienditas.
# 1. Rename `app` below after `fly launch` assigns/confirms a unique name.
# 2. Secrets (never put these here): MONGO_URL, JWT_SECRET, SEED_ADMIN_PASSWORD,
#    S3_ACCESS_KEY, S3_SECRET_KEY — set with `fly secrets set KEY=value`.
app = "pos-tienditas"
primary_region = "qro"  # Querétaro, MX — pick the region closest to your store

[build]

[env]
  DB_NAME = "pos_tienditas"
  CORS_ORIGINS = ""
  COOKIE_SECURE = "true"
  JWT_EXPIRE_MINUTES = "720"
  S3_PUBLIC_READ = "true"
  # Account-specific — set your own via `fly secrets set` (see DEPLOY.md):
  # S3_BUCKET, S3_REGION, S3_ENDPOINT_URL, S3_PUBLIC_URL, S3_ACCESS_KEY, S3_SECRET_KEY

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: a cashier mid-sale can't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
